services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reservation-salles-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PORT: 8000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: reservation-salles-db
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: reservation-salles-phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME}
      PMA_PASSWORD: ${DB_PASSWORD}
      UPLOAD_LIMIT: 300M
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data: